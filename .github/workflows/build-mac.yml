name: Build Mac App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow requests
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --add-data "photos:photos" --name "毛毛桌宠" "我の毛毛桌宠.py"
    
    - name: Compress app
      run: |
        cd dist
        zip -r 毛毛桌宠_Mac.zip 毛毛桌宠.app
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mac-App
        path: dist/*.zip
